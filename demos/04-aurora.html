<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<style>
:root{
  --ink:#0C0E1C; --text:#EDE6D6; --dim:#A9ABC2; --line:rgba(255,255,255,.11);
  --accent:#5CE1E6; --head:236px; --panelH:380px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#vis{position:fixed;inset:0;width:100%;height:100%;display:block}

.pill{position:fixed;top:16px;left:16px;z-index:6;font-size:13px;padding:8px 14px;border-radius:999px;
  background:rgba(12,14,28,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);color:#EDE6D6;text-decoration:none}
.pill b{font-weight:600;margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.22)}
.fade{transition:opacity .35s ease}
body.clean .fade{opacity:0;pointer-events:none}

.title{position:fixed;left:24px;top:70px;z-index:3;pointer-events:none;max-width:min(80vw,900px)}
.title h1{margin:0;font-weight:500;font-size:clamp(30px,4.8vw,64px);line-height:1.02;letter-spacing:-.018em;
  text-shadow:0 2px 30px rgba(12,14,28,.8)}
.title p{margin:10px 0 0;font-size:16px;color:var(--dim);text-shadow:0 1px 12px rgba(12,14,28,.9)}
.hint{position:fixed;top:23px;right:20px;z-index:3;margin:0;font-size:13px;color:var(--dim)}
.hint kbd{font:inherit;color:var(--text);padding:1px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.2);
  background:rgba(12,14,28,.5);margin:0 2px 0 8px}

#bigplay{position:fixed;left:50%;top:calc((100vh - var(--panelH)) / 2 + 20px);transform:translate(-50%,-50%);z-index:4;
  width:148px;height:148px;border-radius:50%;cursor:pointer;display:grid;place-items:center;align-content:center;gap:6px;
  background:rgba(12,14,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid var(--accent);box-shadow:0 0 0 0 rgba(92,225,230,.35),0 0 60px rgba(92,225,230,.25);
  font-size:17px;font-weight:600;animation:breathe 2.6s ease-in-out infinite}
#bigplay svg{width:38px;height:38px;fill:var(--accent);margin-left:6px}
#bigplay:hover{background:rgba(92,225,230,.16)}
@keyframes breathe{50%{box-shadow:0 0 0 16px rgba(92,225,230,0),0 0 80px rgba(92,225,230,.4)}}
@media (prefers-reduced-motion:reduce){#bigplay{animation:none}}
body.started #bigplay{display:none}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px 14px;max-height:66vh;overflow:auto;
  background:rgba(13,15,32,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);transition:transform .4s ease,opacity .4s ease}
body.clean #panel{transform:translateY(100%);opacity:0;pointer-events:none}

.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);color:#06232A;border-color:transparent;font-weight:600}
.btn.primary:hover{background:#86ECEF}
#play{min-width:92px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
#play svg{width:12px;height:12px;fill:currentColor}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.field input[type=text],.field select{height:36px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);padding:0 10px;color:var(--text);font-size:14px}
.field input[type=text]{width:10ch}
.field select option{background:#14172E}
.field input[type=range]{width:110px;accent-color:var(--accent)}
.field output{color:var(--text);min-width:5.2ch;font-size:14px}
.field strong{color:var(--text);font-weight:500;font-size:14px}
.spacer{flex:1}

.tracks{position:relative;display:grid;grid-template-columns:var(--head) minmax(0,1fr);gap:4px 10px;margin-top:12px;align-items:center}
.th{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;opacity:.45}
.tn{width:74px;flex:none}
.ms{width:26px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;
  font-size:11px;font-weight:600;color:var(--dim);padding:0;flex:none}
.ms[aria-pressed=true]{background:var(--text);color:#0C0E1C;border-color:transparent}
.th input[type=range]{flex:1;min-width:40px;height:4px}
.tracks canvas{display:block;width:100%;min-width:0;border-radius:6px;cursor:pointer;touch-action:none}
#playhead{position:absolute;top:0;bottom:0;left:calc(var(--head) + 10px);width:2px;margin-left:-1px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 10px var(--accent);opacity:0;pointer-events:none;will-change:transform}
@media (max-width:820px){
  :root{--head:138px}
  .th input[type=range]{display:none}
  .hint{display:none}
  .spacer{display:none}
}
</style>
<script>if(/[?&]embed\b/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('clean');});</script>

<body>
<canvas id="vis" aria-hidden="true"></canvas>

<a class="pill fade" href="../index.html">← Showcase<b>Aurora</b></a>
<p class="hint fade"><kbd>Space</kbd>play or pause<kbd>N</kbd>new track<kbd>H</kbd>hide controls</p>

<div class="title fade">
  <h1 id="tname">Aurora</h1>
  <p id="tmeta"></p>
</div>

<button id="bigplay" class="fade" aria-label="Play the track">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.2v17.6L20.5 12z"/></svg>
  <span>Play</span>
</button>

<section id="panel" aria-label="Track editor">
  <div class="transport">
    <button class="btn" id="play"><svg viewBox="0 0 12 12" aria-hidden="true"><path id="playIcon" d="M2 1v10l9-5z"/></svg><span id="playLabel">Play</span></button>
    <button class="btn primary" id="compose">Compose new track</button>
    <label class="field">Style
      <select id="style">
        <option value="">Any style</option>
        <option value="lofi">Lo-fi</option>
        <option value="synthwave">Synthwave</option>
        <option value="house">House</option>
        <option value="ambient">Ambient</option>
      </select>
    </label>
    <label class="field">Seed <input type="text" id="seed" maxlength="14" spellcheck="false" autocomplete="off"></label>
    <span class="field">Key <strong id="keyRead"></strong></span>
    <label class="field">Tempo <input type="range" id="tempo" min="56" max="140" step="1"><output id="tempoOut"></output></label>
    <label class="field">Swing <input type="range" id="swing" min="0" max="66" step="1"><output id="swingOut"></output></label>
    <span class="spacer"></span>
    <button class="btn" id="export">Export loop as WAV</button>
  </div>
  <div class="tracks" id="tracks"><div id="playhead"></div></div>
</section>

<script>
'use strict';
/* ================================================================== */
/* Composer: pure functions, deterministic from the seed              */
/* ================================================================== */
const TRACKS = ['kick', 'snare', 'hat', 'bass', 'pad', 'lead'];
const STEPS = 64;
const NOTE_NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const SCALES = {
  major: [0, 2, 4, 5, 7, 9, 11],
  minor: [0, 2, 3, 5, 7, 8, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  lydian: [0, 2, 4, 6, 7, 9, 11]
};
/* Progressions as scale degrees. Each list avoids that scale's diminished triad. */
const PROGS = {
  major: [[0, 4, 5, 3], [0, 5, 3, 4], [3, 4, 5, 0], [0, 3, 5, 4], [1, 4, 0, 5], [5, 3, 0, 4], [0, 2, 3, 4]],
  minor: [[0, 5, 2, 6], [0, 3, 5, 4], [0, 6, 5, 6], [0, 2, 3, 5], [5, 6, 0, 0], [0, 3, 6, 2], [0, 5, 3, 6], [3, 5, 0, 6]],
  dorian: [[0, 3, 0, 3], [0, 6, 3, 0], [0, 2, 3, 6], [0, 3, 6, 2], [0, 4, 3, 6], [1, 4, 0, 0], [0, 6, 2, 3]],
  mixolydian: [[0, 6, 3, 0], [0, 3, 6, 3], [0, 4, 3, 6], [0, 5, 6, 3]],
  lydian: [[0, 1, 0, 1], [0, 1, 5, 4], [0, 4, 1, 0], [0, 2, 1, 0], [5, 1, 0, 4]]
};
const STYLE_IDS = ['lofi', 'synthwave', 'house', 'ambient'];
const STYLES = {
  lofi: { label: 'Lo-fi', tempo: [72, 88], swing: [0.3, 0.52], scales: ['dorian', 'minor', 'major', 'mixolydian'] },
  synthwave: { label: 'Synthwave', tempo: [98, 116], swing: [0, 0], scales: ['minor', 'minor', 'dorian'] },
  house: { label: 'House', tempo: [120, 126], swing: [0.08, 0.24], scales: ['minor', 'dorian', 'mixolydian'] },
  ambient: { label: 'Ambient', tempo: [62, 76], swing: [0, 0], scales: ['lydian', 'major', 'dorian'] }
};
/* Bass templates: [step, length, role]. Roles: 0 root, 1 octave, 2 fifth, 3 approach to the next root. */
const BASS_T = {
  synthwave: [
    [[0, 2, 0], [2, 2, 0], [4, 2, 0], [6, 2, 0], [8, 2, 0], [10, 2, 0], [12, 2, 0], [14, 2, 1]],
    [[0, 1, 0], [1, 1, 0], [2, 1, 1], [3, 1, 0], [4, 1, 0], [5, 1, 0], [6, 1, 1], [7, 1, 0], [8, 1, 0], [9, 1, 0], [10, 1, 1], [11, 1, 0], [12, 1, 0], [13, 1, 0], [14, 1, 1], [15, 1, 0]],
    [[0, 3, 0], [3, 3, 0], [6, 2, 0], [8, 3, 0], [11, 3, 0], [14, 2, 2]],
    [[0, 2, 0], [2, 2, 0], [4, 2, 1], [6, 2, 0], [8, 2, 0], [10, 2, 0], [12, 2, 1], [14, 2, 2]]
  ],
  house: [
    [[2, 2, 0], [6, 2, 0], [10, 2, 0], [14, 2, 0]],
    [[2, 2, 0], [6, 2, 0], [10, 2, 0], [13, 1, 1], [14, 2, 0]],
    [[0, 1, 0], [3, 2, 0], [6, 2, 0], [10, 2, 1], [14, 2, 2]],
    [[2, 1, 0], [3, 2, 0], [6, 2, 0], [10, 1, 0], [11, 2, 0], [14, 2, 2]]
  ],
  lofi: [
    [[0, 6, 0], [7, 2, 2], [10, 4, 0], [14, 2, 3]],
    [[0, 4, 0], [6, 2, 0], [8, 5, 2], [14, 2, 3]],
    [[0, 7, 0], [8, 3, 1], [11, 3, 2], [14, 2, 3]]
  ],
  ambient: [
    [[0, 16, 0]],
    [[0, 10, 0], [10, 6, 2]],
    [[0, 8, 0], [8, 8, 0]]
  ]
};
/* Chord rhythm templates: [step, length]. */
const PAD_T = {
  synthwave: [[[0, 16]], [[0, 8], [8, 8]], [[0, 16]]],
  ambient: [[[0, 16]]],
  lofi: [[[0, 7], [10, 5]], [[0, 6], [7, 3], [11, 5]], [[0, 10], [12, 4]]],
  house: [[[3, 2], [6, 2], [11, 2], [14, 2]], [[0, 2], [3, 2], [6, 3], [10, 2], [13, 2]], [[2, 2], [6, 2], [10, 2], [14, 2]], [[0, 3], [6, 2], [9, 3]]]
};
const MEL = {
  lofi: { lens: [2, 2, 3, 4, 6], rest: 0.35, maxLen: 4 },
  synthwave: { lens: [2, 2, 4, 4, 6, 8], rest: 0.2, maxLen: 6 },
  house: { lens: [1, 2, 2, 3, 3, 4], rest: 0.4, maxLen: 2 },
  ambient: { lens: [4, 6, 8, 8, 12], rest: 0.45, maxLen: 10 }
};
const SOUNDS = {
  lofi: {
    kick: { f0: 125, f1: 47, sweep: 0.07, decay: 0.3, click: 0.12 },
    snare: { type: 'snare', freq: 1500, decay: 0.15, tone: 0.5, lp: 5200 },
    hat: { hp: 6200, lp: 9500, decay: 0.035, open: 0.16, level: 0.55 },
    bass: { wave: 'triangle', sub: 0.55, cut: 5, env: 3, fdecay: 0.2, q: 0.8, gate: 0.92, attack: 0.012 },
    pad: { type: 'keys', decay: 0.55, bright: 1.3, lp: 2400 },
    lead: { type: 'soft' },
    rev: { snare: 0.16, hat: 0.06, pad: 0.26, lead: 0.34 }, dly: { lead: 0.2, pad: 0.05 }, fb: 0.32, duck: 0.3
  },
  synthwave: {
    kick: { f0: 165, f1: 50, sweep: 0.08, decay: 0.3, click: 0.35 },
    snare: { type: 'snare', freq: 1900, decay: 0.26, tone: 0.55, lp: 9000 },
    hat: { hp: 7800, lp: 12500, decay: 0.04, open: 0.22, level: 0.5 },
    bass: { wave: 'sawtooth', sub: 0.45, cut: 3, env: 9, fdecay: 0.13, q: 2.5, gate: 0.78, attack: 0.005 },
    pad: { type: 'saw', cutoff: 1500, attack: 0.3, release: 0.7 },
    lead: { type: 'saw' },
    rev: { snare: 0.42, hat: 0.08, pad: 0.34, lead: 0.3 }, dly: { lead: 0.32, pad: 0.04, snare: 0.06 }, fb: 0.42, duck: 0.42
  },
  house: {
    kick: { f0: 175, f1: 49, sweep: 0.065, decay: 0.36, click: 0.4 },
    snare: { type: 'clap', freq: 1250, decay: 0.2, lp: 8000 },
    hat: { hp: 8200, lp: 13000, decay: 0.035, open: 0.2, level: 0.5 },
    bass: { wave: 'sawtooth', sub: 0.7, cut: 2.5, env: 6, fdecay: 0.09, q: 2, gate: 0.7, attack: 0.004 },
    pad: { type: 'keys', decay: 0.22, bright: 2.2, lp: 3200 },
    lead: { type: 'pluck' },
    rev: { snare: 0.22, hat: 0.06, pad: 0.3, lead: 0.3 }, dly: { lead: 0.3, pad: 0.14, snare: 0.04 }, fb: 0.4, duck: 0.62
  },
  ambient: {
    kick: { f0: 105, f1: 44, sweep: 0.1, decay: 0.45, click: 0 },
    snare: { type: 'snare', freq: 2200, decay: 0.12, tone: 0.2, lp: 4500 },
    hat: { hp: 7000, lp: 10000, decay: 0.05, open: 0.2, level: 0.4 },
    bass: { wave: 'triangle', sub: 0.7, cut: 4, env: 1, fdecay: 0.4, q: 0.7, gate: 1, attack: 0.06 },
    pad: { type: 'saw', cutoff: 1050, attack: 0.9, release: 1.5 },
    lead: { type: 'bell' },
    rev: { snare: 0.5, hat: 0.2, pad: 0.5, lead: 0.6 }, dly: { lead: 0.4, pad: 0.08, snare: 0.1 }, fb: 0.5, duck: 0.12
  }
};
const NAME_A = ['Glass', 'Velvet', 'Neon', 'Quiet', 'Northern', 'Paper', 'Midnight', 'Solar', 'Hollow', 'Amber', 'Distant', 'Silver', 'Slow', 'Electric', 'Winter', 'Coral', 'Violet', 'Drifting', 'Hidden', 'Lunar'];
const NAME_B = ['harbour', 'signal', 'garden', 'motorway', 'lantern', 'tide', 'orbit', 'arcade', 'meadow', 'static', 'horizon', 'daydream', 'current', 'window', 'satellite', 'rain', 'mirage', 'boulevard', 'glacier', 'echo'];

function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function euclid(k, n, rot) {
  const out = [];
  for (let i = 0; i < n; i++) out.push((((i + rot) * k) % n) < k ? 1 : 0);
  return out;
}
/* The first n notes of the scale at or above lo. */
function lattice(key, scale, lo, n) {
  const out = [];
  for (let m = lo; out.length < n; m++) if (scale.includes((((m - key) % 12) + 12) % 12)) out.push(m);
  return out;
}
function clampInt(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function compose(seedText, styleChoice) {
  const seed = String(seedText);
  const R = mulberry32(hashSeed(seed));
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const rf = (a, b) => a + R() * (b - a);
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const chance = p => R() < p;

  const rolled = pick(STYLE_IDS);
  const styleId = STYLES[styleChoice] ? styleChoice : rolled;
  const st = STYLES[styleId];
  const key = ri(0, 11);
  const scaleName = pick(st.scales);
  const scale = SCALES[scaleName];
  const tempo = ri(st.tempo[0], st.tempo[1]);
  const swing = Math.round(rf(st.swing[0], st.swing[1]) * 100) / 100;
  const prog = pick(PROGS[scaleName]);
  const lat = {
    bass: lattice(key, scale, 36, 14),
    pad: lattice(key, scale, 50, 15),
    lead: lattice(key, scale, 62, 15)
  };

  /* Chords, stacked in thirds inside the scale */
  const seventh = styleId === 'lofi' || (styleId === 'house' && chance(0.7));
  const chords = prog.map(d => {
    const wholeToneAbove = (((scale[(d + 1) % 7] - scale[d % 7]) + 12) % 12) === 2;
    let degs = [d, d + 2, d + 4];
    if (styleId === 'ambient') { degs = [d, d + 4, d + 2]; if (wholeToneAbove) degs.push(d + 8); }
    else if (seventh) degs.push(d + 6);
    if (styleId === 'lofi' && wholeToneAbove && chance(0.4)) degs.push(d + 8);
    const pcs = [...new Set(degs.map(x => (key + scale[x % 7]) % 12))];
    return { deg: d, rootPc: (key + scale[d % 7]) % 12, pcs };
  });

  /* Drums */
  const kick = new Array(STEPS).fill(0), snare = new Array(STEPS).fill(0), hat = new Array(STEPS).fill(0);
  const hatOpen = new Array(STEPS).fill(false);
  const set = (arr, bar, s, v) => { arr[bar * 16 + s] = Math.round(v * 100) / 100; };
  if (styleId === 'house') {
    const eh = euclid(ri(5, 9), 16, ri(0, 3));
    for (let b = 0; b < 4; b++) {
      for (const s of [0, 4, 8, 12]) set(kick, b, s, 1);
      set(snare, b, 4, 0.9); set(snare, b, 12, 0.9);
      for (let s = 0; s < 16; s++) {
        if (s % 4 === 2) { set(hat, b, s, 0.8); hatOpen[b * 16 + s] = true; }
        else if (eh[s]) set(hat, b, s, s % 4 === 0 ? 0.3 : 0.45);
      }
    }
    if (chance(0.6)) set(kick, 3, 14, 0.8);
    if (chance(0.5)) { set(snare, 1, 15, 0.4); set(snare, 3, 15, 0.5); }
    if (chance(0.5)) set(snare, 3, 11, 0.45);
  } else if (styleId === 'synthwave') {
    const four = chance(0.3);
    const extra = pick([[], [10], [6], [7, 10], [10, 14]]);
    const hat16 = chance(0.3);
    for (let b = 0; b < 4; b++) {
      if (four) for (const s of [0, 4, 8, 12]) set(kick, b, s, 1);
      else { set(kick, b, 0, 1); set(kick, b, 8, 1); for (const s of extra) set(kick, b, s, 0.85); }
      set(snare, b, 4, 1); set(snare, b, 12, 1);
      for (let s = 0; s < 16; s++) {
        if (hat16) set(hat, b, s, s % 4 === 0 ? 0.6 : s % 2 === 0 ? 0.45 : 0.28);
        else if (s % 2 === 0) set(hat, b, s, s % 4 === 0 ? 0.6 : 0.42);
      }
    }
    if (chance(0.65)) { set(snare, 3, 13, 0.45); set(snare, 3, 14, 0.6); set(snare, 3, 15, 0.8); }
    if (chance(0.5)) { set(hat, 1, 14, 0.6); hatOpen[16 + 14] = true; set(hat, 3, 6, 0.6); hatOpen[48 + 6] = true; }
  } else if (styleId === 'lofi') {
    const kp = pick([[0, 7, 10], [0, 10], [0, 3, 10], [0, 6, 10], [0, 9, 10], [0, 10, 11]]);
    const ghostAt = pick([7, 9, 15, -1]);
    for (let b = 0; b < 4; b++) {
      kp.forEach((s, i) => set(kick, b, s, i === 0 ? 0.95 : 0.75));
      set(snare, b, 4, 0.8); set(snare, b, 12, 0.85);
      if (ghostAt >= 0) set(snare, b, ghostAt, 0.28);
      for (let s = 0; s < 16; s += 2) set(hat, b, s, s % 4 === 0 ? 0.5 : 0.32);
    }
    hat[ri(1, 31) * 2] = 0;
    if (chance(0.6)) set(hat, 1, 15, 0.25);
    if (chance(0.6)) set(hat, 3, 11, 0.25);
    if (chance(0.6)) set(kick, 3, 14, 0.7);
    if (chance(0.4)) { set(hat, 3, 14, 0.5); hatOpen[48 + 14] = true; }
  } else {
    const kp = pick([[0], [0, 10], [0, 8]]);
    const eh = euclid(ri(3, 5), 16, ri(0, 3));
    const rimBars = pick([[1, 3], [0, 1, 2, 3], [3]]);

    ridgeNear.push(0.2 + 0.5 * noise1(x * 0.0045 + 9, 6) + 0.3 * noise1(x * 0.016, 7) + 0.1 * noise1(x * 0.06, 8));
  }
  for (const id of TRACKS) sizeTrack(id);
  drawAllTracks();
  gridW = trackEls.kick.cv.clientWidth;
  measure();
  if (!floorY) floorY = floorTarget;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(measure).observe($('panel'));

function readAudio(t) {
  const live = g && g.analyser && freqData;
  if (live) {
    g.analyser.getByteFrequencyData(freqData); g.analyser.getByteTimeDomainData(timeData);
    const binHz = actx.sampleRate / g.analyser.fftSize, Ln = freqData.length;
    for (let i = 0; i < NB; i++) {
      const b0 = 40 * Math.pow(2, i * 8.4 / NB) / binHz, b1 = 40 * Math.pow(2, (i + 1) * 8.4 / NB) / binHz;
      let v;
      if (b1 - b0 < 1) { const k = Math.min(Ln - 2, Math.floor(b0)), fr = b0 - k; v = freqData[k] * (1 - fr) + freqData[k + 1] * fr; }
      else { let s = 0, c = 0; for (let k = Math.floor(b0); k < Math.min(b1, Ln); k++) { s += freqData[k]; c++; } v = c ? s / c : 0; }
      v = Math.pow(v / 255, 1.7) * (1 + i / NB * 1.2);
      bandsReal[i] += (v - bandsReal[i]) * (v > bandsReal[i] ? 0.55 : 0.1);
    }
  }
  energy += ((playing ? 1 : 0) - energy) * 0.04;
  for (let i = 0; i < NB; i++) {
    let idle = 0.32 + 0.24 * Math.sin(t * 0.5 + i * 0.21) * Math.sin(t * 0.23 + i * 0.07) + 0.12 * Math.sin(t * 0.9 + i * 0.5);
    idle = Math.max(0.08, Math.min(0.8, idle));
    bands[i] = idle * (1 - energy * 0.72) + Math.min(1.25, bandsReal[i] * 1.15) * energy;
  }
  /* waveform ribbon */
  for (let i = 0; i < WN; i++) {
    const u = i / (WN - 1);
    let v = 0.22 * Math.sin(u * 9 + t * 1.1) * Math.sin(u * 3.1 - t * 0.4) + 0.1 * Math.sin(u * 23 - t * 1.7);
    v *= (1 - energy * 0.85);
    if (live && energy > 0.01) v += ((timeData[Math.floor(u * (timeData.length - 1))] - 128) / 128) * 2.2 * energy;
    waveTrail[i] += (wave[i] - waveTrail[i]) * 0.18;
    wave[i] += (v - wave[i]) * 0.6;
  }
}

function drawAurora(t) {
  const lw = low.width, lh = low.height, fl = floorY / LOWDIV, ts = REDUCED ? 0.3 : 1;
  lc.globalCompositeOperation = 'source-over'; lc.globalAlpha = 1; lc.clearRect(0, 0, lw, lh);
  lc.globalCompositeOperation = 'lighter';
  for (let k = 0; k < CURTAINS.length; k++) {
    const c = CURTAINS[k], tt = t * ts;
    for (let x = 0; x < lw; x++) {
      const u = x / lw, bp = Math.min(1, Math.abs(u - c.centre) * 1.9), bi = bp * (NB - 1), i0 = Math.floor(bi), fr = bi - i0;
      const e = bands[i0] * (1 - fr) + bands[Math.min(NB - 1, i0 + 1)] * fr;
      const yb = fl * (c.y + 0.05 * Math.sin(u * 6.3 * c.f + tt * c.sp * 8 + k * 1.7) + 0.025 * Math.sin(u * 17 * c.f - tt * c.sp * 13));
      const h = fl * c.h * (0.25 + 1.05 * e) * (1 + 0.22 * pulse * (1 - bp));
      const ray = 0.5 + 0.5 * noise1(u * 85 * c.f + tt * c.sp * 22, k) * (0.6 + 0.4 * noise1(u * 14 - tt * c.sp * 6, k + 9));
      lc.globalAlpha = Math.min(1, c.a * ray * (0.3 + 0.75 * e) * (1 + 0.25 * pulse));
      lc.drawImage(c.strip, 0, 0, 1, 256, x, yb - h, 1, h);
    }
  }
  lc.globalAlpha = 1;
}
function ridgePath(arr, height) {
  vc.beginPath(); vc.moveTo(0, VH);
  for (let i = 0; i < arr.length; i++) vc.lineTo(i * 8, floorY - arr[i] * height);
  vc.lineTo(VW, VH); vc.closePath();
}
function drawWave(arr, y, amp, color, width, blur, alpha) {
  vc.beginPath();
  for (let i = 0; i < WN; i++) {
    const x = i / (WN - 1) * VW, yy = y + arr[i] * amp;
    if (i === 0) vc.moveTo(x, yy);
    else { const px = (i - 1) / (WN - 1) * VW, py = y + arr[i - 1] * amp; vc.quadraticCurveTo(px, py, (px + x) / 2, (py + yy) / 2); }
  }
  vc.lineWidth = width; vc.strokeStyle = color; vc.shadowColor = color; vc.shadowBlur = blur; vc.globalAlpha = alpha;
  vc.lineJoin = 'round'; vc.stroke();
  vc.shadowBlur = 0; vc.globalAlpha = 1;
}

function frame(ms) {
  const t = ms / 1000;
  /* audio-clock events: playhead, kick pulse, track lights */
  if (playing && actx) {
    const now = actx.currentTime - (actx.outputLatency || 0);
    while (visQ.length && visQ[0].t <= now) {
      const ev = visQ.shift(); curStep = ev.step; curStepT = ev.t; curSd = ev.sd;
      if (ev.hits & 1) pulse = 1;
      TRACKS.forEach((id, i) => { if (ev.hits & (1 << i)) flash[id] = 1; });
    }
    const ph = $('playhead');
    if (curStep >= 0) {
      const frac = (curStep + Math.max(0, Math.min(1, (now - curStepT) / curSd))) / STEPS;
      ph.style.opacity = 1; ph.style.transform = 'translateX(' + (frac * gridW).toFixed(1) + 'px)';
    }
  } else $('playhead').style.opacity = 0;
  for (const id of TRACKS) {
    const f = flash[id], dot = trackEls[id].dot;
    dot.style.opacity = (0.45 + 0.55 * f).toFixed(2); dot.style.transform = 'scale(' + (1 + 0.7 * f).toFixed(2) + ')';
    flash[id] = f * 0.86;
  }
  pulse *= 0.9;
  floorY += (floorTarget - floorY) * 0.09;

  readAudio(t);
  vc.setTransform(DPR, 0, 0, DPR, 0, 0);
  vc.globalCompositeOperation = 'source-over';
  const bg = vc.createLinearGradient(0, 0, 0, floorY);
  bg.addColorStop(0, '#06081A'); bg.addColorStop(0.55, '#0C0E1C'); bg.addColorStop(1, '#141C40');
  vc.fillStyle = bg; vc.fillRect(0, 0, VW, VH);

  vc.fillStyle = '#EDE6D6';
  for (const s of stars) {
    vc.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    vc.fillRect(s.x, s.y, s.r, s.r);
  }
  vc.globalAlpha = 1;

  drawAurora(t);
  vc.globalCompositeOperation = 'lighter';
  vc.imageSmoothingEnabled = true; vc.imageSmoothingQuality = 'high';
  vc.drawImage(low, 0, 0, low.width * LOWDIV, low.height * LOWDIV);
  vc.globalCompositeOperation = 'source-over';

  /* horizon glow follows the low end */
  const lowE = (bands[1] + bands[4] + bands[8]) / 3;
  const glow = vc.createLinearGradient(0, floorY - VH * 0.3, 0, floorY);
  glow.addColorStop(0, 'rgba(92,225,230,0)'); glow.addColorStop(1, 'rgba(92,225,230,' + (0.05 + 0.16 * lowE + 0.08 * pulse).toFixed(3) + ')');
  vc.fillStyle = glow; vc.fillRect(0, floorY - VH * 0.3, VW, VH * 0.3);

  vc.fillStyle = '#0B0F26'; ridgePath(ridgeFar, VH * 0.15); vc.fill();
  vc.fillStyle = '#070916'; ridgePath(ridgeNear, VH * 0.085); vc.fill();

  const wy = floorY - VH * 0.2, amp = VH * 0.055;
  drawWave(waveTrail, wy, amp, '#B692FF', 5, 16, 0.3);
  drawWave(wave, wy, amp, '#5CE1E6', 2, 14, 0.92);

  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
(function init() {
  let seed = '314159';
  try { const h = decodeURIComponent(location.hash.slice(1)).trim(); if (h) seed = h.slice(0, 14); } catch (e) {}
  song = compose(seed, '');
  resize(); showMeta();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
