<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom — cloth, rope and jelly physics</title>
<style>
:root{--ink:#0C0E1C;--cream:#EDE6D6;--mute:#9C9EB8;--gold:#FFD166;--line:rgba(255,255,255,.14);--glass:rgba(12,14,28,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);overflow:hidden;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.held{cursor:grabbing}
canvas.cut{cursor:crosshair}
.ui{transition:opacity .25s ease}
body.bare .ui{opacity:0;pointer-events:none}
.pill{position:fixed;top:16px;left:16px;z-index:5;font-size:13px;padding:8px 14px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:#EDE6D6;text-decoration:none}
.pill b{font-weight:600;color:var(--gold);margin-left:8px}
.pill:hover{border-color:rgba(255,209,102,.5)}
.scenes{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:2px;padding:4px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);max-width:calc(100vw - 32px)}
.scenes button{font:inherit;font-size:13px;color:var(--mute);background:none;border:0;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.scenes button:hover{color:var(--cream)}
.scenes button[aria-pressed=true]{background:var(--gold);color:#1A1606;font-weight:600}
.scenes kbd{font:inherit;font-size:11px;opacity:.55;margin-right:6px}
.panel{position:fixed;top:68px;right:16px;z-index:4;width:228px;padding:14px 14px 12px;border-radius:16px;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:13px}
.panel label{display:grid;grid-template-columns:1fr auto;row-gap:2px;margin-bottom:10px;color:var(--mute)}
.panel output{color:var(--cream)}
.panel input[type=range]{grid-column:1/3;width:100%;margin:2px 0 0;accent-color:var(--gold);height:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.panel button{font:inherit;font-size:12.5px;color:var(--cream);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;
  padding:7px 6px;cursor:pointer}
.panel button:hover{background:rgba(255,255,255,.12)}
.panel button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.1)}
.panel .wide{width:100%}
.help{position:fixed;left:16px;bottom:16px;z-index:4;padding:11px 14px;border-radius:14px;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--mute);
  display:grid;grid-template-columns:auto auto;column-gap:14px}
.help span:nth-child(odd){color:var(--cream)}
.stats{position:fixed;right:16px;bottom:16px;z-index:4;font-size:12.5px;line-height:1.65;color:var(--mute);text-align:right;
  padding:11px 14px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.stats b{color:var(--cream);font-weight:500}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:820px){.help{display:none}.panel{width:190px}.scenes{top:60px}.panel{top:112px}}
</style>
<script>if(/[?&]embed\b/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('bare');});</script>
</head>
<body>
<canvas id="c" aria-label="Loom physics sandbox"></canvas>

<a class="pill ui" href="../index.html">← Showcase<b>Loom</b></a>

<nav class="scenes ui" aria-label="Scenes">
  <button data-scene="curtain"><kbd>1</kbd>Curtain</button>
  <button data-scene="flag"><kbd>2</kbd>Flag</button>
  <button data-scene="net"><kbd>3</kbd>Net and spheres</button>
  <button data-scene="jelly"><kbd>4</kbd>Jelly</button>
  <button data-scene="ropes"><kbd>5</kbd>Ropes</button>
</nav>

<aside class="panel ui" aria-label="Settings">
  <label><span>Wind</span><output id="oWind"></output><input id="wind" type="range" min="0" max="100" step="1"></label>
  <label><span>Wind direction</span><output id="oDir"></output><input id="dir" type="range" min="-180" max="180" step="5"></label>
  <label><span>Gravity</span><output id="oGrav"></output><input id="grav" type="range" min="0" max="2" step="0.05"></label>
  <label><span>Tear strength</span><output id="oTear"></output><input id="tear" type="range" min="1.3" max="6" step="0.1"></label>
  <div class="row">
    <button id="bSlow" aria-pressed="false">Slow motion</button>
    <button id="bWire" aria-pressed="false">Wireframe</button>
  </div>
  <div class="row">
    <button id="bAuto" aria-pressed="true">Auto demo</button>
    <button id="bBall">Drop a ball</button>
  </div>
  <button id="bReset" class="wide">Reset scene</button>
</aside>

<div class="help ui">
  <span>Drag</span><span>pull the fabric</span>
  <span>Right-drag or Shift-drag</span><span>slice it</span>
  <span>Click a pin</span><span>release it</span>
  <span>1 to 5</span><span>change scene</span>
  <span>R, S, W, B</span><span>reset, slow motion, wireframe, ball</span>
  <span>Space, A, H</span><span>pause, auto demo, hide controls</span>
</div>

<div class="stats ui">
  <div><b id="sP">0</b> particles</div>
  <div><b id="sC">0</b> threads holding</div>
  <div><b id="sT">0</b> torn</div>
  <div><b id="sF">60</b> frames a second</div>
</div>

<script>
//<core>
// Loom physics core: no DOM, runs headless. Verlet integration, 360 Hz substeps,
// Gauss-Seidel distance constraints that break when over-stretched.
function createSim() {
  'use strict';
  const MAXP = 9600, MAXC = 46000, MAXB = 16, MAXG = 256;
  const G = 1800, H = 1 / 360, H2 = H * H, KN = 150, KD = 10, VMAX = 36;
  const F = n => new Float64Array(n), I = n => new Int32Array(n), U = n => new Uint8Array(n);
  const px = F(MAXP), py = F(MAXP), pz = F(MAXP), ox = F(MAXP), oy = F(MAXP), oz = F(MAXP);
  const hx = F(MAXP), hy = F(MAXP), hz = F(MAXP), pm = F(MAXP), im = F(MAXP), prad = F(MAXP);
  const wx = F(MAXP), wy = F(MAXP), wz = F(MAXP), ty = F(MAXP);
  const pin = U(MAXP), pkin = U(MAXP), pcloth = U(MAXP), pbody = new Int16Array(MAXP);
  const ca = I(MAXC), cb = I(MAXC), oa = I(MAXC), ob = I(MAXC), cq1 = I(MAXC), cq2 = I(MAXC), broken = I(MAXC);
  const crest = F(MAXC), cstiff = F(MAXC), cth = F(MAXC), calive = U(MAXC), ckind = U(MAXC);
  const bx = F(MAXB), by = F(MAXB), bz = F(MAXB), box = F(MAXB), boy = F(MAXB), boz = F(MAXB), br = F(MAXB), bim = F(MAXB), bcol = U(MAXB);
  const S = {
    np: 0, nc: 0, nb: 0, nbroken: 0, cuts: 0, time: 0, iters: 2, gust: 1, spawned: 0, ballSeq: 0, fixed: 0,
    cloths: [], bodies: [], ropes: [], pegs: [], scene: null,
    params: { wind: 0, windDir: 0, gravity: 1, tear: 2.5 },
    px, py, pz, ox, oy, oz, im, pm, prad, pin, pkin, pbody, pcloth,
    ca, cb, oa, ob, crest, calive, ckind, broken, bx, by, bz, br, bcol, H
  };
  let seed = 1;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const grab = { active: false, n: 0, idx: I(MAXG), gx: F(MAXG), gy: F(MAXG), gz: F(MAXG), sx0: 0, sy0: 0, dx: 0, dy: 0, ball: -1, bx0: 0, by0: 0, bz0: 0 };
  const tmp = [0, 0, 0];

  function clear() {
    S.np = S.nc = S.nb = S.nbroken = S.cuts = S.spawned = S.ballSeq = 0; S.time = 0;
    S.cloths.length = S.bodies.length = S.ropes.length = S.pegs.length = 0;
    grab.active = false; grab.n = 0; grab.ball = -1;
  }
  function addP(x, y, z, m, rad) {
    const i = S.np++;
    px[i] = ox[i] = hx[i] = x; py[i] = oy[i] = hy[i] = y; pz[i] = oz[i] = hz[i] = z;
    pm[i] = im[i] = m; prad[i] = rad || 0; pin[i] = 0; pkin[i] = 0; pcloth[i] = 0; pbody[i] = -1;
    wx[i] = wy[i] = wz[i] = 0;
    return i;
  }
  function addC(a, b, kind, stiff, rest) {
    const k = S.nc++;
    if (rest === undefined) { const dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a]; rest = Math.sqrt(dx * dx + dy * dy + dz * dz); }
    ca[k] = a; cb[k] = b; ckind[k] = kind; cstiff[k] = stiff; crest[k] = rest; calive[k] = 1;
    oa[k] = ob[k] = cq1[k] = cq2[k] = -1; cth[k] = 0.78 + 0.44 * rnd();
    return k;
  }
  function mass(i) { im[i] = (pin[i] || pkin[i]) ? 0 : pm[i]; }
  function setPin(i, v) { pin[i] = v ? 1 : 0; mass(i); if (v) { ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i]; } }
  function breakC(k) {
    if (!calive[k]) return;
    calive[k] = 0; S.cuts++;
    if (ckind[k] !== 1) broken[S.nbroken++] = k;
    const q1 = cq1[k], q2 = cq2[k];
    if (q1 >= 0) calive[q1] = 0;
    if (q2 >= 0) calive[q2] = 0;
  }

  // ---- builders ---------------------------------------------------------
  function addCloth(cols, rows, rest, posFn, toneFn, shear) {
    const p0 = S.np, qc = cols - 1, qr = rows - 1;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { posFn(c, r, tmp); pcloth[addP(tmp[0], tmp[1], tmp[2], 1, 0)] = 1; }
    const h0 = S.nc;
    for (let r = 0; r < rows; r++) for (let c = 0; c < qc; c++) {
      const a = p0 + r * cols + c, k = addC(a, a + 1, 0, 1, rest);
      oa[k] = c > 0 ? a - 1 : -1; ob[k] = c < qc - 1 ? a + 2 : -1;
    }
    const v0 = S.nc;
    for (let r = 0; r < qr; r++) for (let c = 0; c < cols; c++) {
      const a = p0 + r * cols + c, k = addC(a, a + cols, 0, 1, rest);
      oa[k] = r > 0 ? a - cols : -1; ob[k] = r < qr - 1 ? a + 2 * cols : -1;
    }
    const s0 = S.nc, diag = rest * Math.SQRT2;
    for (let r = 0; r < qr; r++) for (let c = 0; c < qc; c++) {
      const A = p0 + r * cols + c;
      if ((r + c) & 1) addC(A + 1, A + cols, 1, shear, diag); else addC(A, A + cols + 1, 1, shear, diag);
    }
    // a cut thread also frees the diagonals of the two cells beside it
    for (let r = 0; r < rows; r++) for (let c = 0; c < qc; c++) {
      const k = h0 + r * qc + c;
      if (r > 0) cq1[k] = s0 + (r - 1) * qc + c;
      if (r < qr) cq2[k] = s0 + r * qc + c;
    }
    for (let r = 0; r < qr; r++) for (let c = 0; c < cols; c++) {
      const k = v0 + r * cols + c;
      if (c > 0) cq1[k] = s0 + r * qc + c - 1;
      if (c < qc) cq2[k] = s0 + r * qc + c;
    }
    const nq = qc * qr, tone = new Uint8Array(nq);
    for (let r = 0; r < qr; r++) for (let c = 0; c < qc; c++) tone[r * qc + c] = toneFn(c, r, qc, qr);
    const cl = { cols, rows, p0, h0, v0, s0, rest, tone, nq, qn: new Float32Array(nq * 3), qa: new Uint8Array(nq) };
    S.cloths.push(cl);
    return cl;
  }
  function addRope(pts, invM, rad, style) {
    const p0 = S.np, n = pts.length / 3;
    for (let i = 0; i < n; i++) addP(pts[3 * i], pts[3 * i + 1], pts[3 * i + 2], invM, rad);
    const c0 = S.nc;
    for (let i = 0; i < n - 1; i++) addC(p0 + i, p0 + i + 1, 2, 1);
    const rp = { p0, n, c0, style, bob: -1, bobR: 0, tint: 0 };
    S.ropes.push(rp);
    return rp;
  }
  function polyArea(ring) {
    let A = 0; const n = ring.length;
    for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; A += px[p] * py[q] - px[q] * py[p]; }
    return A * 0.5;
  }
  function finishBody(ring, center, color, skin) {
    const id = S.bodies.length, col = center >= 0 ? new Int32Array(ring.length + 1) : new Int32Array(ring.length);
    col.set(ring); if (center >= 0) col[ring.length] = center;
    let cx = 0, cy = 0; for (let i = 0; i < ring.length; i++) { cx += px[ring[i]]; cy += py[ring[i]]; }
    cx /= ring.length; cy /= ring.length;
    const b = { id, ring, center, col, color, skin, area0: Math.abs(polyArea(ring)), a0: Math.atan2(py[ring[0]] - cy, px[ring[0]] - cx), gain: 0.07, x0: 0, y0: 0, x1: 0, y1: 0, first: 0, last: 0 };
    S.bodies.push(b);
    return b;
  }
  function addBlob(cx, cy, R, n, color) {
    const id = S.bodies.length, ring = new Int32Array(n), sp = 2 * Math.PI * R / n, first = S.np;
    for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI; ring[i] = addP(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 0, 1, sp * 0.56); pbody[ring[i]] = id; }
    const c = addP(cx, cy, 0, 1, R * 0.4); pbody[c] = id;
    const half = n >> 1;
    for (let i = 0; i < n; i++) {
      addC(ring[i], ring[(i + 1) % n], 3, 1);
      addC(ring[i], ring[(i + 2) % n], 3, 0.03);
      addC(ring[i], c, 3, 0.015);
      if (i < half) addC(ring[i], ring[i + half], 3, 0.004);
    }
    const b = finishBody(ring, c, color, sp * 1.1); b.first = first; b.last = S.np;
    return b;
  }
  function addBlock(x0, y0, nx, ny, s, color) {
    const id = S.bodies.length, first = S.np, at = (c, r) => first + r * nx + c;
    for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
      const edge = r === 0 || c === 0 || r === ny - 1 || c === nx - 1;
      pbody[addP(x0 + c * s, y0 + r * s, 0, 1, edge ? s * 0.52 : 0)] = id;
    }
    for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
      if (c < nx - 1) addC(at(c, r), at(c + 1, r), 3, 0.3);
      if (r < ny - 1) addC(at(c, r), at(c, r + 1), 3, 0.3);
      if (c < nx - 1 && r < ny - 1) { addC(at(c, r), at(c + 1, r + 1), 3, 0.22); addC(at(c + 1, r), at(c, r + 1), 3, 0.22); }
    }
    const hull = [];
    for (let c = 0; c < nx; c++) hull.push(at(c, 0));
    for (let r = 1; r < ny; r++) hull.push(at(nx - 1, r));
    for (let c = nx - 2; c >= 0; c--) hull.push(at(c, ny - 1));
    for (let r = ny - 2; r > 0; r--) hull.push(at(0, r));
    const b = finishBody(Int32Array.from(hull), -1, color, s * 1.0); b.first = first; b.last = S.np; b.gain = 0.16;
    return b;
  }
  function spawnBall(x, y, z, r, invM) {
    let b;
    if (S.nb < MAXB) b = S.nb++; else { b = S.ballSeq % MAXB; if (b === grab.ball) b = (b + 1) % MAXB; }
    bx[b] = box[b] = x; by[b] = boy[b] = y; bz[b] = boz[b] = z; br[b] = r; bim[b] = invM; bcol[b] = S.ballSeq % 5;
    S.ballSeq++;
    return b;
  }

  // ---- scenes -----------------------------------------------------------
  function baseScene(WW, WH, o) {
    const tilt = o.tilt || 0;
    return Object.assign({
      W: WW, Hh: WH, tilt, cT: Math.cos(tilt), sT: Math.sin(tilt), pivotY: WH / 2, floorY: Infinity, killY: WH + 520,
      wallL: -Infinity, wallR: Infinity, damp: 0.9985, friction: 0.6, grabR: 24, zBias: -0.22, ambient: null, decor: {},
      rect: { x0: 0, y0: 0, x1: WW, y1: WH }, defaults: { wind: 0, windDir: 0, gravity: 1, tear: 2.5 }, warm: 0,
      palette: [[233, 224, 204], [71, 86, 184], [255, 209, 102]]
    }, o);
  }
  const SCENES = {
    curtain(WW, WH) {
      const yo = (WH - 900) / 2, cx = WW / 2, r = 11, rows = 56;
      const spans = Math.max(12, Math.min(27, Math.floor(WW * 0.62 / (3 * r)))), cols = spans * 4 + 1;
      const wdt = spans * 3 * r, x0 = cx - wdt / 2, rodY = yo + 108, d = 0.6614 * r, zig = [0, d, 0, -d];
      const cl = addCloth(cols, rows, r, (c, rr, o) => { o[0] = x0 + c * 0.75 * r; o[1] = rodY + rr * r; o[2] = zig[c & 3]; },
        (c, rr, qc, qr) => { if (rr >= qr - 2) return 1; if (rr === qr - 3) return 2; const m = c % 16; return m < 9 ? 0 : m === 12 ? 2 : 1; }, 0.5);
      for (let c = 0; c < cols; c += 4) setPin(cl.p0 + c, 1);
      for (let rr = 1; rr < rows; rr++) for (let c = 0; c < cols; c++) oz[cl.p0 + rr * cols + c] += 0.5 * (rr / rows) * (1 + Math.sin(c * 0.11));
      return baseScene(WW, WH, { rect: { x0, y0: rodY, x1: x0 + wdt, y1: rodY + (rows - 1) * r }, warm: 300,
        defaults: { wind: 24, windDir: 0, gravity: 1, tear: 2.4 }, decor: { rod: { x0: x0 - 46, x1: x0 + wdt + 46, y: rodY - 9 } } });
    },
    flag(WW, WH) {
      const yo = (WH - 900) / 2, cx = WW / 2, r = 10, cols = 66, rows = 42, poleX = Math.max(90, cx - 420), top = yo + 170;
      const cl = addCloth(cols, rows, r, (c, rr, o) => { o[0] = poleX + c * r; o[1] = top + rr * r; o[2] = 1.5 * Math.sin(c * 0.6 + rr * 0.35); },
        (c, rr, qc, qr) => { const dx = c - qc * 0.42, dy = rr - qr * 0.5, rad = Math.sqrt(dx * dx + dy * dy), R = qr * 0.27;
          return rad < R ? 2 : rad < R + 1.7 ? 0 : (rr < 5 || rr >= qr - 5) ? 0 : 1; }, 0.8);
      for (let rr = 0; rr < rows; rr++) if (rr % 3 === 0 || rr === rows - 1) setPin(cl.p0 + rr * cols, 1);
      return baseScene(WW, WH, { rect: { x0: poleX, y0: top, x1: poleX + (cols - 1) * r, y1: top + (rows - 1) * r }, warm: 360, damp: 0.998, zBias: -0.06,
        defaults: { wind: 70, windDir: 0, gravity: 1, tear: 2.8 }, decor: { pole: { x: poleX - 7, y0: top - 54 } } });
    },
    net(WW, WH) {
      const yo = (WH - 900) / 2, cx = WW / 2, r = 11, cols = 64, rows = 52, y0 = yo + 400, floorY = yo + 770, tilt = 52 * Math.PI / 180;
      const cl = addCloth(cols, rows, r, (c, rr, o) => { o[0] = cx + (c - (cols - 1) / 2) * r; o[1] = y0; o[2] = ((rows - 1) / 2 - rr) * r; },
        (c, rr, qc, qr) => (c < 2 || rr < 2 || c >= qc - 2 || rr >= qr - 2) ? 2 : (((c - 2) >> 2) + ((rr - 2) >> 2)) & 1, 0.5);
      const posts = [];
      for (const [c0, r0] of [[0, 0], [cols - 3, 0], [0, rows - 3], [cols - 3, rows - 3]]) {
        for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) setPin(cl.p0 + (r0 + a) * cols + c0 + b, 1);
        const m = cl.p0 + (r0 + 1) * cols + c0 + 1; posts.push({ x: px[m], y: y0, z: pz[m] });
      }
      const hw = (cols - 1) * r / 2, hz = (rows - 1) * r / 2 * Math.sin(tilt);
      const sc = baseScene(WW, WH, { tilt, pivotY: y0, floorY, friction: 0.5, rect: { x0: cx - hw, y0: y0 - hz, x1: cx + hw, y1: y0 + hz },
        palette: [[233, 224, 204], [73, 170, 160], [255, 209, 102]], defaults: { wind: 0, windDir: -90, gravity: 1, tear: 3.2 }, decor: { posts, grid: true } });
      sc.ambient = () => {
        if (S.spawned < 6 && S.time > 0.5 + S.spawned * 1.5) { spawnBall(cx + (rnd() - 0.5) * 320, yo - 460, (rnd() - 0.5) * 220, 32 + rnd() * 12, 1 / 34); S.spawned++; }
      };
      sc.dropBall = () => spawnBall(cx + (rnd() - 0.5) * 320, yo - 460, (rnd() - 0.5) * 220, 32 + rnd() * 12, 1 / 34);
      return sc;
    },
