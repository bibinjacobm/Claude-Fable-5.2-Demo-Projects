<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FableOS</title>
<style>
:root{
  --accent:#F2A7C3; --teal:#7FD1C4; --gold:#F4D06F; --paper:#f6efe2; --night:#221f3a;
  --spine-w:64px;
  --ui:"Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --desk:#1c1a31; --ink:#f3ecdf; --dim:#a9a3c4; --sheet:#272543; --sheet2:#34315a;
  --edge:#0c0b19; --field:#1d1b36; --shadow:#0b0a18; --spine:#121122; --rule:rgba(243,236,223,.14);
}
:root[data-theme="light"]{
  --desk:#e7dcc6; --ink:#221f3a; --dim:#6a6485; --sheet:#fbf6ec; --sheet2:#efe4cf;
  --edge:#221f3a; --field:#fffdf7; --shadow:#221f3a; --spine:#221f3a; --rule:rgba(34,31,58,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font:14px/1.4 var(--ui)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#desk{position:fixed;left:var(--spine-w);top:0;right:0;bottom:0;z-index:1;overflow:hidden;user-select:none;-webkit-user-select:none}

/* Desktop icons */
#icons{position:absolute;inset:16px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;pointer-events:none}
.dicon{pointer-events:auto;width:94px;padding:8px 4px 6px;border:0;border-radius:12px;background:none;cursor:default;display:flex;flex-direction:column;align-items:center;gap:5px}
.dicon:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.dicon.sel{background:color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.dicon.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.dname{font-size:12px;font-weight:600;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ficon{width:46px;height:46px;display:block;flex:none}
.ficon svg{width:100%;height:100%;display:block}
.f-fill{fill:var(--accent);stroke:var(--night);stroke-width:2.5;stroke-linejoin:round}
.f-sheet{fill:var(--paper);stroke:var(--night);stroke-width:2.5;stroke-linejoin:round}
.f-line{fill:none;stroke:var(--night);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ficon.thumb{border:2.5px solid var(--night);border-radius:6px;overflow:hidden;background:var(--paper);height:36px;margin:5px 0}
.ficon.thumb img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* Spine launcher */
#spine{position:fixed;left:0;top:0;bottom:0;width:var(--spine-w);z-index:2;background:var(--spine);color:var(--paper);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px;user-select:none;-webkit-user-select:none}
#spine::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--accent)}
.mark{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:16px;letter-spacing:.02em;padding:12px 8px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--paper)}
.mark:hover,.mark[aria-expanded="true"]{background:rgba(255,255,255,.1)}
.band{width:34px;height:7px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);flex:none;opacity:.9}
#apps{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow-y:auto;overflow-x:visible;padding:2px 0;scrollbar-width:none;align-items:center;width:100%}
.app-btn{position:relative;width:42px;height:42px;flex:none;border:0;border-radius:13px;background:none;color:var(--paper);cursor:pointer;display:grid;place-items:center}
.app-btn svg{width:22px;height:22px}
.app-btn:hover{background:rgba(255,255,255,.1)}
.app-btn.running::before{content:"";position:absolute;left:-7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent)}
.app-btn.active{background:var(--accent);color:var(--night)}
#tip{position:fixed;z-index:4;left:calc(var(--spine-w) + 8px);padding:4px 10px;border-radius:8px;background:var(--paper);color:var(--night);font-size:12.5px;font-weight:600;border:2px solid var(--night);box-shadow:3px 3px 0 var(--shadow);pointer-events:none;display:none;white-space:nowrap}
#clock{text-align:center;line-height:1.15;font-variant-numeric:tabular-nums}
#clock b{display:block;font-size:15px}
#clock span{font-size:11px;opacity:.7}
#menu{position:fixed;z-index:3;left:calc(var(--spine-w) + 10px);top:12px;min-width:200px;padding:6px;border-radius:12px;background:var(--sheet);color:var(--ink);border:2px solid var(--edge);box-shadow:6px 6px 0 var(--shadow);display:none}
#menu.open{display:block;animation:win-in .14s ease-out}
#menu a,#menu button{display:flex;justify-content:space-between;gap:16px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;text-decoration:none;color:inherit;cursor:pointer;font-weight:600}
#menu a:hover,#menu button:hover{background:var(--accent);color:var(--night)}
#menu kbd{font:inherit;font-weight:400;opacity:.65}

/* Windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);border:2px solid var(--edge);border-radius:13px;box-shadow:6px 6px 0 var(--shadow);outline:none;transition:transform .22s cubic-bezier(.4,0,.7,.2),opacity .2s,box-shadow .12s;--mx:-300px;--my:0px}
.win.focused{box-shadow:8px 8px 0 color-mix(in srgb,var(--accent) 72%,var(--night))}
.win.opening{animation:win-in .17s cubic-bezier(.2,.9,.3,1.2)}
.win.closing{transform:scale(.94);opacity:0;pointer-events:none;transition-duration:.14s}
.win.mini{transform:translate(var(--mx),var(--my)) scale(.06);opacity:0;pointer-events:none}
.win.gone{display:none}
.win.glide{transition:left .18s,top .18s,width .18s,height .18s,box-shadow .12s}
.win.maxed{border-radius:0;box-shadow:none}
.win.maxed .rz{display:none}
.win.dragging{transition:none}
@keyframes win-in{from{transform:scale(.92) translateY(10px);opacity:0}}
.win-head{flex:none;height:38px;display:flex;align-items:flex-end;padding:0 8px 0 10px;background:var(--sheet2);border-bottom:2px solid var(--edge);border-radius:11px 11px 0 0;cursor:grab;touch-action:none}
.win.maxed .win-head{border-radius:0}
.win.dragging .win-head{cursor:grabbing}
.win-tab{display:flex;align-items:center;gap:7px;height:29px;max-width:calc(100% - 100px);padding:0 14px 0 9px;margin-bottom:-2px;background:var(--sheet);border:2px solid var(--edge);border-bottom-color:var(--sheet);border-radius:10px 10px 0 0;font-size:13px;font-weight:600;color:var(--dim)}
.win.focused .win-tab{background:var(--accent);border-bottom-color:var(--edge);color:var(--night)}
.win-ico{width:16px;height:16px;flex:none}
.win-ico svg{width:16px;height:16px;display:block}
.win-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-ctl{margin-left:auto;align-self:center;display:flex;gap:6px}
.win-ctl button{width:22px;height:22px;padding:0;border:2px solid var(--edge);border-radius:50%;background:var(--sheet);cursor:pointer;position:relative}
.win-ctl button:hover{background:var(--accent)}
.win-ctl button::before,.win-ctl button::after{content:"";position:absolute;left:50%;top:50%;background:var(--ink)}
.win-ctl button:hover::before,.win-ctl button:hover::after{background:var(--night)}
.c-min::before{width:8px;height:2px;margin:-1px 0 0 -4px}
.c-min::after{display:none}
.win-ctl .c-max::before{width:8px;height:8px;margin:-4px 0 0 -4px;background:none;border:2px solid var(--ink);border-radius:2px}
.win-ctl .c-max:hover::before{background:none;border-color:var(--night)}
.c-max::after{display:none}
.c-close::before,.c-close::after{width:10px;height:2px;margin:-1px 0 0 -5px}
.c-close::before{transform:rotate(45deg)}
.c-close::after{transform:rotate(-45deg)}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:0 0 11px 11px}
.win.maxed .win-body{border-radius:0}
.win-body.col{display:flex;flex-direction:column}
.rz{position:absolute;z-index:5;touch-action:none}
.rz-n{left:12px;right:12px;top:-5px;height:9px;cursor:ns-resize}
.rz-s{left:12px;right:12px;bottom:-5px;height:9px;cursor:ns-resize}
.rz-e{top:12px;bottom:12px;right:-5px;width:9px;cursor:ew-resize}
.rz-w{top:12px;bottom:12px;left:-5px;width:9px;cursor:ew-resize}
.rz-ne,.rz-nw,.rz-se,.rz-sw{width:16px;height:16px}
.rz-ne{right:-5px;top:-5px;cursor:nesw-resize}
.rz-nw{left:-5px;top:-5px;cursor:nwse-resize}
.rz-se{right:-5px;bottom:-5px;cursor:nwse-resize}
.rz-sw{left:-5px;bottom:-5px;cursor:nesw-resize}
#snap{position:absolute;z-index:2147483000;display:none;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:12px;pointer-events:none;transition:left .1s,top .1s,width .1s,height .1s}

/* Shared app parts */
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:2px solid var(--rule)}
.bar .gap{flex:1}
.btn{padding:4px 11px;border:2px solid var(--edge);border-radius:9px;background:var(--sheet);font-weight:600;font-size:12.5px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap}
.btn:hover{background:var(--sheet2)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.on,.btn.primary{background:var(--accent);color:var(--night)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.status{flex:none;padding:5px 12px;font-size:12px;color:var(--dim);border-top:2px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:28px}
.status.err{color:#ff8a7a}
:root[data-theme="light"] .status.err{color:#b3261e}
.stage{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden}
.stage canvas.fill{position:absolute;inset:0;width:100%;height:100%;display:block}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.check input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.check input[type=range]{width:90px;accent-color:var(--accent)}
.ask{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:color-mix(in srgb,var(--desk) 62%,transparent);border-radius:11px}
.ask-box{width:min(320px,calc(100% - 32px));padding:14px;border-radius:12px;background:var(--sheet);border:2px solid var(--edge);box-shadow:5px 5px 0 var(--shadow);display:flex;flex-direction:column;gap:10px}
.ask-title{font-weight:600}
.ask-input{width:100%;padding:7px 9px;border:2px solid var(--edge);border-radius:8px;background:var(--field);user-select:text;-webkit-user-select:text}
.ask-row{display:flex;justify-content:flex-end;gap:8px}

/* Terminal */
.term{background:#14132a;color:#e9e2d2;font:13px/1.5 var(--mono)}
.term-scroll{position:absolute;inset:0;overflow-y:auto;padding:10px 12px;cursor:text}
.term-out{user-select:text;-webkit-user-select:text}
.term-line{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.term-line.err{color:#ff9d8a}
.term-line.dim{color:#8d88ad}
.term-p,.term-art,.term-prompt{color:var(--accent)}
.term-row{display:flex;white-space:pre}
.term-in{flex:1;min-width:0;padding:0;border:0;outline:0;background:none;font:inherit;color:inherit;caret-color:var(--accent);user-select:text;-webkit-user-select:text}

/* Files */
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow:hidden;font-size:12.5px}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.crumbs button:hover{background:var(--accent);color:var(--night)}
.crumbs i{font-style:normal;opacity:.4}
.file-grid{flex:1;min-height:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:4px;align-content:start}
.file-grid .dicon{width:auto}
.empty{grid-column:1/-1;padding:28px 12px;text-align:center;color:var(--dim)}

/* Notes */
.note-area{flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;padding:14px 16px;background:var(--field);color:var(--ink);font:14px/1.6 var(--ui);user-select:text;-webkit-user-select:text}

/* Paint */
.swatch{width:20px;height:20px;padding:0;border:2px solid var(--edge);border-radius:50%;cursor:pointer;flex:none}
.swatch.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--accent)}
.pick{width:26px;height:24px;padding:0;border:2px solid var(--edge);border-radius:7px;background:none;cursor:pointer}
.size-dot{display:block;border-radius:50%;background:currentColor;margin:auto}
.paint-stage{background:color-mix(in srgb,var(--desk) 55%,var(--sheet))}
.paint-cv{position:absolute;border:2px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);touch-action:none;cursor:crosshair;background:var(--paper)}

/* Calculator */
.calc{padding:12px;gap:10px}
.calc-screen{flex:none;padding:10px 12px;border:2px solid var(--edge);border-radius:11px;background:var(--field);text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc-hist{font-size:12px;color:var(--dim);min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-expr{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;min-height:36px}
.calc-live{font-size:13px;color:var(--dim);min-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-live.err{color:#ff8a7a}
.calc-keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:7px}
.calc-keys .btn{font-size:16px;padding:0}
.calc-keys .op{background:var(--sheet2)}

/* Monitor, settings, about */
.pad{padding:14px;overflow:auto}
.mon-top{flex:none;display:flex;align-items:baseline;gap:10px;padding:12px 14px 4px}
.mon-top b{font-size:30px;font-variant-numeric:tabular-nums}
.mon-top span{color:var(--dim);font-size:12.5px}
.mon-graph{flex:none;height:96px;margin:0 14px;border:2px solid var(--edge);border-radius:10px;background:var(--field)}
.mon-list{flex:1;min-height:0;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.mon-list h3,.pad h3{margin:0 0 6px;font-size:13px}
.mon-list ul{margin:0;padding:0;list-style:none}
.mon-list li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;border-bottom:1px dashed var(--rule)}
.mon-list li span{color:var(--dim)}
.meter{height:12px;border:2px solid var(--edge);border-radius:7px;background:var(--field);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);min-width:3px}
.small{font-size:12.5px;color:var(--dim)}
.set-row{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;align-items:center}
.wall-opt{padding:0;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--field);cursor:pointer;box-shadow:2px 2px 0 var(--shadow);display:flex;flex-direction:column}
.wall-opt canvas{display:block;width:112px;height:66px}
.wall-opt span{padding:3px 0 4px;font-size:12px;font-weight:600;text-align:center}
.wall-opt.on{box-shadow:0 0 0 3px var(--accent)}
.set-row .swatch{width:28px;height:28px}
.about{display:flex;flex-direction:column;gap:10px;line-height:1.5}
.about h2{margin:0;font-size:30px;line-height:1.1}
.about p{margin:0;max-width:44ch}
.about dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.about dt{font-weight:600}
.about dd{margin:0;color:var(--dim)}
.about a{color:inherit;font-weight:600}

/* Boot */
#boot{position:fixed;inset:0;z-index:10;background:var(--night);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .32s,transform .32s}
#boot.done{opacity:0;transform:scale(1.04);pointer-events:none}
.boot-mark{font-size:clamp(44px,9vw,92px);font-weight:700;letter-spacing:-.01em;display:flex}
.boot-mark span{display:inline-block;animation:rise .5s cubic-bezier(.2,.9,.3,1.3) both}
.boot-mark span:nth-child(n+6){color:var(--accent)}
.boot-bar{width:min(280px,60vw);height:8px;border:2px solid var(--paper);border-radius:6px;overflow:hidden}
.boot-bar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:fill 1.05s cubic-bezier(.5,0,.3,1) both}
.boot-line{font-size:13px;opacity:.75;min-height:1.4em}
@keyframes rise{from{transform:translateY(.5em);opacity:0}}
@keyframes fill{from{transform:scaleX(0)}}

@media (max-width:640px){:root{--spine-w:54px}.dicon{width:80px}}
@media (prefers-reduced-motion:reduce){
  .win,.win.glide,#snap,#boot{transition:none}
  .win.opening,.dicon.pop,#menu.open,.boot-mark span,.boot-bar i{animation:none}
}
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>

<main id="desk" aria-label="Desktop">
  <div id="icons"></div>
  <div id="snap"></div>
</main>

<nav id="spine" aria-label="Launcher">
  <button class="mark" id="markBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="System menu">FableOS</button>
  <div class="band" aria-hidden="true"></div>
  <div id="apps"></div>
  <div class="band" aria-hidden="true"></div>
  <div id="clock" aria-label="Clock"><b id="clockT">00:00</b><span id="clockD"></span></div>
</nav>
<div id="tip" role="tooltip"></div>
<div id="menu" role="menu">
  <a href="../index.html" role="menuitem">← Showcase</a>
  <button type="button" role="menuitem" data-act="about">About FableOS</button>
  <button type="button" role="menuitem" data-act="cycle">Next window <kbd>Alt + `</kbd></button>
  <button type="button" role="menuitem" data-act="restart">Restart</button>
</div>

<div id="boot" role="status">
  <div class="boot-mark" aria-label="FableOS"><span>F</span><span>a</span><span>b</span><span>l</span><span>e</span><span>O</span><span>S</span></div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-line" id="bootLine">Opening the cover</div>
</div>

<script>
'use strict';
/*<core>*/
/* ---------- Core: virtual file system, shell, calculator (no DOM) ---------- */

function createVFS(store, seed) {
  const listeners = new Set();
  let root = null;
  const api = {};
  const D = c => ({ t: 'd', c: c || {}, m: Date.now() });
  const F = d => ({ t: 'f', d: d == null ? '' : String(d), m: Date.now() });
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const parts = p => p.split('/').filter(Boolean);
  const base = p => { const a = parts(p); return a[a.length - 1] || ''; };
  const dirname = p => { const a = parts(p); a.pop(); return '/' + a.join('/'); };

  function norm(path, cwd) {
    let p = String(path == null ? '' : path);
    if (p === '') p = cwd || '/';
    else if (p === '~') p = '/home';
    else if (p.startsWith('~/')) p = '/home/' + p.slice(2);
    else if (!p.startsWith('/')) p = (cwd || '/') + '/' + p;
    const out = [];
    for (const s of p.split('/')) {
      if (!s || s === '.') continue;
      if (s === '..') out.pop(); else out.push(s);
    }
    return '/' + out.join('/');
  }
  function node(p) {
    let n = root;
    for (const s of parts(p)) {
      if (!n || n.t !== 'd' || !has(n.c, s)) return null;
      n = n.c[s];
    }
    return n || null;
  }
  function fail(msg) { const e = new Error(msg); e.vfs = true; throw e; }
  function need(p) { const n = node(p); if (!n) fail('no such file or folder: ' + p); return n; }
  function parentFor(p) {
    if (p === '/') fail('cannot change /');
    const dn = dirname(p), d = node(dn);
    if (!d) fail('no such folder: ' + dn);
    if (d.t !== 'd') fail('not a folder: ' + dn);
    const name = base(p);
    if (name === '__proto__' || name.length > 80) fail('that name cannot be used: ' + name);
    return d;
  }
  function build(obj) {
    const d = D();
    for (const k of Object.keys(obj)) d.c[k] = typeof obj[k] === 'string' ? F(obj[k]) : build(obj[k]);
    return d;
  }
  function save() {
    try { if (store) store.set(JSON.stringify(root)); api.saved = true; }
    catch (e) { api.saved = false; }
    return api.saved;
  }
  function changed(p) { save(); listeners.forEach(fn => { try { fn(p); } catch (e) {} }); }
  const count = n => Object.keys(n.c).length;

        if (layoutKeys.includes(k)) {
          if (e.key === 'Enter' && e.target.tagName === 'BUTTON' && e.target.closest('.win-ctl')) return;
          e.preventDefault(); press(k);
        }
      });
      show();
    }
  };

  /* ----- Orbit chimes (the toy) ----- */
  APPS.chimes = {
    name: 'Orbit chimes', w: 380, h: 440, minW: 280, minH: 300, single: true, at: [0.72, 0.9],
    launch(win) {
      win.body.classList.add('col');
      const RINGS = 5, NOTES = [587.33, 440, 392, 293.66, 220];
      const bar = el('div', 'bar');
      const snd = el('label', 'check'), cb = el('input'); cb.type = 'checkbox'; snd.append(cb, document.createTextNode('Sound'));
      const sp = el('label', 'check'), range = el('input'); range.type = 'range'; range.min = '0.3'; range.max = '2.5'; range.step = '0.1'; range.value = '1';
      sp.append(document.createTextNode('Speed'), range);
      const scatter = tbtn('Scatter'), clear = tbtn('Clear');
      bar.append(snd, sp, el('span', 'gap'), scatter, clear);
      const stage = el('div', 'stage'), cv = el('canvas', 'fill'), status = el('div', 'status', 'Click a ring to plant a chime. Click a chime to remove it.');
      stage.append(cv); win.body.append(bar, stage, status);
      const c = cv.getContext('2d');
      let w = 0, h = 0, dpr = 1, angle = -Math.PI / 2, ac = null, master = null, chimes = [];
      win.onResize(() => {
        const r = stage.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
        w = Math.max(40, r.width); h = Math.max(40, r.height);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      });
      const radius = () => Math.max(20, Math.min(w, h) / 2 - 18);
      function pattern(random) {
        chimes = [];
        const n = random ? 7 + Math.floor(Math.random() * 7) : 11;
        for (let i = 0; i < n; i++) chimes.push({
          ring: random ? Math.floor(Math.random() * RINGS) : (i * 3) % RINGS,
          a: random ? Math.round(Math.random() * 16) / 16 * TAU : (i / 11) * TAU + ((i * 7) % 3) * 0.2, hit: -1e9
        });
      }
      function audioOn() {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC(); master = ac.createGain(); master.gain.value = 0.6;
        const d = ac.createDelay(1), fb = ac.createGain(); d.delayTime.value = 0.31; fb.gain.value = 0.32;
        master.connect(ac.destination); master.connect(d); d.connect(fb); fb.connect(d); fb.connect(ac.destination);
      }
      function ring(ch, t) {
        ch.hit = t;
        if (!cb.checked || !ac) return;
        const now = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
        o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = NOTES[ch.ring]; o2.frequency.value = NOTES[ch.ring] * 2.01; g2.gain.value = 0.25;
        g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.22, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, now + 1.6);
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
        o.start(now); o2.start(now); o.stop(now + 1.7); o2.stop(now + 1.7);
      }
      cb.addEventListener('change', () => { if (cb.checked) audioOn(); });
      scatter.addEventListener('click', () => pattern(true));
      clear.addEventListener('click', () => { chimes = []; });
      cv.addEventListener('pointerdown', e => {
        const r = cv.getBoundingClientRect(), x = e.clientX - r.left - w / 2, y = e.clientY - r.top - h / 2, R = radius();
        const idx = Math.round(Math.hypot(x, y) / R * RINGS) - 1;
        if (idx < 0 || idx >= RINGS) return;
        const a = (Math.atan2(y, x) + TAU) % TAU, rr = R * (idx + 1) / RINGS;
        const hit = chimes.findIndex(ch => { if (ch.ring !== idx) return false; let d = Math.abs(ch.a - a) % TAU; if (d > Math.PI) d = TAU - d; return d * rr < 13; });
        if (hit >= 0) { chimes.splice(hit, 1); return; }
        const ch = { ring: idx, a, hit: -1e9 }; chimes.push(ch);
        cb.checked = true; audioOn(); ring(ch, performance.now());
      });
      win.raf((t, dt) => {
        if (!w) return;
        const stepA = REDUCED ? 0 : dt * 0.0012 * parseFloat(range.value), prev = angle; angle += stepA;
        const R = radius(), cols = [pal.accent, pal.teal, pal.gold, pal.accent, pal.teal];
        c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
        c.save(); c.translate(w / 2, h / 2);
        c.lineWidth = 1.5; c.strokeStyle = pal.ink;
        for (let i = 0; i < RINGS; i++) { c.globalAlpha = 0.22; c.beginPath(); c.arc(0, 0, R * (i + 1) / RINGS, 0, TAU); c.stroke(); }
        c.globalAlpha = 1; c.strokeStyle = pal.accent; c.lineWidth = 2.5; c.lineCap = 'round';
        c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(angle) * R, Math.sin(angle) * R); c.stroke();
        for (const ch of chimes) {
          const da = (((ch.a - prev) % TAU) + TAU) % TAU;
          if (stepA > 0 && da < stepA) ring(ch, t);
          const rr = R * (ch.ring + 1) / RINGS, x = Math.cos(ch.a) * rr, y = Math.sin(ch.a) * rr, age = (t - ch.hit) / 700;
          c.fillStyle = cols[ch.ring]; c.strokeStyle = cols[ch.ring];
          if (age >= 0 && age < 1) { c.globalAlpha = 1 - age; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 6 + age * 22, 0, TAU); c.stroke(); c.globalAlpha = 1; }
          c.beginPath(); c.arc(x, y, age >= 0 && age < 1 ? 7.5 - age * 2 : 5.5, 0, TAU); c.fill();
        }
        c.fillStyle = pal.ink; c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
        c.restore();
        if (angle > TAU) angle -= TAU;
      });
      win.onClose(() => { if (ac) { const x = ac; ac = null; x.close().catch(() => {}); } });
      pattern(false);
    }
  };

  /* ----- System monitor ----- */
  APPS.monitor = {
    name: 'System monitor', w: 360, h: 430, minW: 280, minH: 300, single: true,
    launch(win) {
      win.body.classList.add('col');
      const top = el('div', 'mon-top'), big = el('b', '', '60'), cap = el('span', '', 'frames per second');
      top.append(big, cap);
      const gbox = el('div', 'stage mon-graph'), cv = el('canvas', 'fill'); gbox.append(cv);
      const list = el('div', 'mon-list');
      const sWin = el('section'), hWin = el('h3', '', 'Open windows'), ul = el('ul'); sWin.append(hWin, ul);
      const sSto = el('section'), hSto = el('h3', '', 'Storage'), meter = el('div', 'meter'), mi = el('i'), stoText = el('div', 'small');
      meter.append(mi); sSto.append(hSto, meter, stoText);
      const up = el('div', 'small');
      list.append(sWin, sSto, up); win.body.append(top, gbox, list);
      const c = cv.getContext('2d'); let w = 0, h = 0, dpr = 1;
      win.onResize(() => {
        const r = gbox.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
        w = Math.max(20, gbox.clientWidth || r.width); h = Math.max(20, gbox.clientHeight || r.height);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      });
      win.raf(() => {
        if (!w) return;
        const f = Ticker.frames, start = Ticker.index;
        let peak = 0; for (let i = 0; i < 120; i++) if (f[i] > 0) peak = Math.max(peak, 1000 / f[i]);
        const top2 = peak > 80 ? 130 : 70;
        c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
        c.strokeStyle = pal.dim; c.globalAlpha = 0.35; c.lineWidth = 1; c.setLineDash([4, 4]);
        for (const v of [30, 60]) { const y = h - v / top2 * h; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
        c.setLineDash([]); c.globalAlpha = 1;
        c.beginPath(); let first = true;
        for (let i = 0; i < 120; i++) {
          const dt = f[(start + i) % 120]; if (!(dt > 0)) continue;
          const x = i / 119 * w, y = h - Math.min(top2, 1000 / dt) / top2 * (h - 6) - 3;
          if (first) { c.moveTo(x, y); first = false; } else c.lineTo(x, y);
        }
        c.strokeStyle = pal.accent; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
      });
      function refresh() {
        big.textContent = String(Math.round(Ticker.fps));
        ul.textContent = '';
        for (const x of WM.wins.slice().sort((a, b) => a.id - b.id)) {
          const li = el('li'); li.append(document.createTextNode(x.title), el('span', '', x.min ? 'minimised' : x === WM.focused ? 'in front' : 'open')); ul.append(li);
        }
        const used = vfs.size(), cnt = vfs.count(), quota = 5 * 1048576;
        mi.style.width = Math.min(100, used / quota * 100).toFixed(2) + '%';
        stoText.textContent = fmtSize(used) + ' of about 5 MB, ' + cnt.files + ' files in ' + cnt.dirs + ' folders' + (vfs.saved ? '' : '. Storage is full, so new changes last only for this visit.');
        const s = Math.round((performance.now() - bootTime) / 1000);
        up.textContent = 'Running for ' + (s >= 60 ? Math.floor(s / 60) + ' min ' : '') + (s % 60) + ' s';
      }
      win.interval(refresh, 500); refresh();
    }
  };

  /* ----- Settings ----- */
  APPS.settings = {
    name: 'Settings', w: 420, h: 430, minW: 300, minH: 280, single: true,
    launch(win) {
      const pad = el('div', 'pad'); pad.style.height = '100%'; win.body.append(pad);
      const status = el('div', 'small');
      pad.append(el('h3', '', 'Wallpaper'));
      const rowW = el('div', 'set-row'), thumbs = [];
      for (const id of Object.keys(WALLS)) {
        const b = el('button', 'wall-opt'); b.type = 'button'; const cv = el('canvas'); cv.width = 224; cv.height = 132;
        b.append(cv, el('span', '', WALL_NAMES[id]));
        b.addEventListener('click', () => { settings.wall = id; applySettings(true); });
        thumbs.push([id, b, cv]); rowW.append(b);
      }
      pad.append(rowW, el('h3', '', 'Accent colour'));
      const rowA = el('div', 'set-row'), sw = [];
      for (const [hex, name] of ACCENTS) {
        const b = el('button', 'swatch'); b.type = 'button'; b.style.background = hex; b.title = name; b.setAttribute('aria-label', name);
        b.addEventListener('click', () => { settings.accent = hex; applySettings(true); });
        sw.push([hex, b]); rowA.append(b);
      }
      pad.append(rowA, el('h3', '', 'Appearance'));
      const rowT = el('div', 'set-row'), bDark = tbtn('Dark'), bLight = tbtn('Light');
      bDark.addEventListener('click', () => { settings.theme = 'dark'; applySettings(true); });
      bLight.addEventListener('click', () => { settings.theme = 'light'; applySettings(true); });
      rowT.append(bDark, bLight);
      pad.append(rowT, el('h3', '', 'Files'));
      const rowF = el('div', 'set-row'), bReset = tbtn('Reset files');
      rowF.append(bReset, status); pad.append(rowF);
      bReset.addEventListener('click', async () => {
        const yes = await win.ask({ title: 'Reset files? Everything you saved will be replaced by the starter files.', confirm: true, ok: 'Reset files' });
        if (yes) { vfs.reset(); seedPictures(); status.textContent = 'Files reset.'; }
      });
      function sync() {
        for (const [id, b, cv] of thumbs) {
          b.classList.toggle('on', id === settings.wall); b.setAttribute('aria-pressed', String(id === settings.wall));
          const c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); WALLS[id](c, 224, 132, 4000, pal);
        }
        for (const [hex, b] of sw) b.classList.toggle('on', hex === settings.accent);
        bDark.classList.toggle('on', settings.theme === 'dark'); bLight.classList.toggle('on', settings.theme === 'light');
      }
      settingsListeners.add(sync); win.onClose(() => settingsListeners.delete(sync));
      sync();
    }
  };

  /* ----- About ----- */
  APPS.about = {
    name: 'About FableOS', w: 400, h: 400, minW: 280, minH: 240, single: true,
    launch(win) {
      const box = el('div', 'pad about'); box.style.height = '100%';
      box.append(el('h2', '', 'FableOS'), el('p', '', 'A small desktop that lives in one HTML file. Windows, files, a terminal and eight apps, with nothing downloaded and nothing installed.'));
      const dl = el('dl');
      for (const [k, v] of [['Alt + `', 'Next window'], ['Double-click a title bar', 'Maximise or restore'], ['Drag to a side edge', 'Snap to half the screen'], ['Drag to the top edge', 'Maximise'], ['Shift-click a launcher icon', 'Open another window']]) dl.append(el('dt', '', k), el('dd', '', v));
      box.append(dl);
      const a = el('a', '', '← Showcase'); a.href = '../index.html';
      const p = el('p'); p.append(a); box.append(p);
      win.body.append(box);
    }
  };

  /* Launcher, menu, clock, desktop icons */
  const appsBox = $('#apps'), tip = $('#tip');
  for (const id of ORDER) {
    const b = el('button', 'app-btn'); b.type = 'button'; b.innerHTML = glyph(id); b.setAttribute('aria-label', APPS[id].name);
    b.addEventListener('click', e => {
      const mine = WM.wins.filter(w => w.appId === id);
      if (!mine.length || (e.shiftKey && !APPS[id].single)) { openApp(id); return; }
      const top = mine.sort((a, c) => c.lastFocus - a.lastFocus)[0];
      if (WM.focused === top && !top.min) minimise(top); else focus(top);
    });
    const showTip = () => { const r = b.getBoundingClientRect(); tip.textContent = APPS[id].name; tip.style.top = (r.top + r.height / 2 - 14) + 'px'; tip.style.display = 'block'; };
    const hideTip = () => { tip.style.display = 'none'; };
    b.addEventListener('pointerenter', showTip); b.addEventListener('pointerleave', hideTip);
    b.addEventListener('focus', showTip); b.addEventListener('blur', hideTip);
    spineBtns[id] = b; appsBox.append(b);
  }
  const menu = $('#menu'), markBtn = $('#markBtn');
  const setMenu = open => { menu.classList.toggle('open', open); markBtn.setAttribute('aria-expanded', String(open)); };
  markBtn.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
  menu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    setMenu(false);
    if (b.dataset.act === 'about') openApp('about');
    else if (b.dataset.act === 'cycle') cycle();
    else if (b.dataset.act === 'restart') location.reload();
  });
  document.addEventListener('pointerdown', e => { if (!menu.contains(e.target) && e.target !== markBtn) setMenu(false); });

  const clockT = $('#clockT'), clockD = $('#clockD');
  function tick() {
    const d = new Date();
    clockT.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    clockD.textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
  }
  setInterval(tick, 1000); tick();

  const iconsBox = $('#icons');
  let knownIcons = null, iconSel = null;
  function renderIcons() {
    let items = []; try { items = vfs.list(DESKTOP); } catch (e) {}
    iconsBox.textContent = '';
    for (const it of items) {
      const p = vfs.norm(it.name, DESKTOP);
      const b = el('button', 'dicon' + (iconSel === it.name ? ' sel' : '') + (knownIcons && !knownIcons.has(it.name) ? ' pop' : '')); b.type = 'button';
      b.append(fileIcon(p, it.type), el('span', 'dname', it.name));
      b.addEventListener('click', () => { iconSel = it.name; iconsBox.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); });
      b.addEventListener('dblclick', () => openPath(p));
      b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); openPath(p); } });
      iconsBox.append(b);
    }
    knownIcons = new Set(items.map(i => i.name));
  }
  desk.addEventListener('pointerdown', e => {
    if (e.target === desk || e.target === iconsBox) { iconSel = null; iconsBox.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); }
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Backquote' && (e.altKey || e.ctrlKey)) { e.preventDefault(); cycle(); }
    else if (e.key === 'Escape') setMenu(false);
  }, true);
  window.addEventListener('resize', () => {
    sizeWall();
    const a = A();
    for (const w of WM.wins) {
      w.x = Math.round(clamp(w.x, 90 - w.w, Math.max(0, a.w - 90))); w.y = Math.round(clamp(w.y, 0, Math.max(0, a.h - 40)));
      layout(w);
    }
  });

  /* Attract mode: runs until the first real input */
  const Attract = {
    on: true, timers: new Set(),
    later(fn, ms) { const h = setTimeout(() => { this.timers.delete(h); if (this.on) fn(); }, ms); this.timers.add(h); },
    stop() { if (!this.on) return; this.on = false; this.timers.forEach(clearTimeout); this.timers.clear(); INPUTS.forEach(t => window.removeEventListener(t, stopAttract, true)); }
  };
  const INPUTS = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
  function stopAttract(e) { if (e && e.isTrusted === false) return; Attract.stop(); }
  INPUTS.forEach(t => window.addEventListener(t, stopAttract, { capture: true, passive: true }));
  function runAttract() {
    if (!Attract.on) return;
    const alive = () => Attract.on;
    const term = openApp('terminal', { at: [0.2, 0.16] });
    /* keep the desktop icon column visible so the new file can be seen arriving */
    term.x = Math.round(clamp(Math.max(term.x, 126), 6, Math.max(6, A().w - term.w - 6))); layout(term);
    const say = (text, pause, next) => Attract.later(() => {
      if (term.closed) return;
      focus(term); term.typeRun(text, alive, next);
    }, pause);
    say('sysinfo', 450, () =>
      say('ls desktop', 900, () =>
        say('echo "made in the terminal" > desktop/hello.txt', 700, () =>
          Attract.later(() => {
            openApp('files', { path: DESKTOP, at: [0.94, 0.1] });
            say('cat notes/haiku.txt', 900, () =>
              say('open chimes', 1100, () =>
                say('echo "your turn. click anything"', 1500, null)));
          }, 700))));
  }

  /* Boot */
  applySettings(false);
  sizeWall();
  const fresh = !vfs.load();
  if (fresh) seedPictures();
  vfs.on(renderIcons);
  renderIcons();
  refreshSpine();
  const boot = $('#boot'), bootLine = $('#bootLine');
  const steps = ['Unpacking the file system', 'Hanging the wallpaper', 'Waking the windows', 'Ready'];
  const quick = REDUCED ? 0.3 : 1;
  steps.forEach((s, i) => setTimeout(() => { bootLine.textContent = s; }, (220 + i * 250) * quick));
  setTimeout(() => boot.classList.add('done'), 1150 * quick);
  setTimeout(() => { boot.remove(); runAttract(); }, 1500 * quick);
})();
</script>
